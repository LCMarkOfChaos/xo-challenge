<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarkOfChaos X/O Challenge</title>
<style>
body{margin:0;padding:0;font-family:Arial,sans-serif;text-align:center;background-image:url("image/XOGame.png");background-size:cover;background-position:center;background-attachment:fixed;min-height:100vh;color:white;text-shadow:2px 2px 4px #000}
#startButton,
#nextButton,
#restartButton {
    position: fixed;
    top: 10px;
    left: 10px;
    margin: 0;
    font-size: 20px;
    font-weight: bold;
    padding: 12px 28px;
    min-width: 120px;
    color: white;
    background: rgba(0, 0, 0, 0.75);
    border: 2px solid white;
    border-radius: 12px;
    cursor: pointer;
    z-index: 1000;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

#startButton:hover,
#nextButton:hover,
#restartButton:hover {
    background: rgba(50, 50, 50, 0.9);
    transform: scale(1.05);
}
#nextButton,#restartButton{display:none}#game{padding-top:80px}#questionNumber{font-size:22px;font-weight:bold;margin:10px}#question{font-size:28px;font-weight:bold;margin:20px auto;max-width:800px}#timer{font-size:26px;font-weight:bold;margin:15px}#answers{display:flex;justify-content:center;gap:20px;margin:20px auto;max-width:900px}.answerButton{font-size:22px;padding:18px 25px;min-width:250px;cursor:pointer;border:2px solid #333;border-radius:8px;background:white;color:#111;text-shadow:none}.answerButton:hover{background:#eee}.answerButton.correct{background:#8cff8c}.answerButton.wrong{background:#ff8c8c}#result{font-size:32px;font-weight:bold;margin-top:15px;min-height:40px}#explanation{font-size:20px;line-height:1.4;margin:8px auto 20px;max-width:700px;min-height:30px;font-weight:normal}
  #score {
    display: none;
    font-size: 22px;
    font-weight: bold;
    margin: 15px;
}
</style></head><body>
<button id="startButton">START</button><button id="nextButton">NEXT</button><button id="restartButton">PLAY AGAIN</button>
<div id="game"><div id="questionNumber"></div><div id="question"></div><div id="timer"></div><div id="answers"><button class="answerButton" id="answer0"></button><button class="answerButton" id="answer1"></button></div><div id="result"></div><div id="explanation"></div><div id="score">Score: 0 / 10</div></div>
<script>
let allQuestions=[];let questions=[];let currentQuestion=0;let score=0;let answered=false;let timerInterval=null;let revealTimeout=null;let questionsPerGame=10;
const startButton=document.getElementById("startButton"),nextButton=document.getElementById("nextButton"),restartButton=document.getElementById("restartButton"),questionNumber=document.getElementById("questionNumber"),question=document.getElementById("question"),timer=document.getElementById("timer"),answer0=document.getElementById("answer0"),answer1=document.getElementById("answer1"),answers=[answer0,answer1],result=document.getElementById("result"),explanation=document.getElementById("explanation"),scoreDisplay=document.getElementById("score");
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]]}return array}
async function loadQuestions(){try{const response=await fetch("questions.json",{cache:"no-store"});if(!response.ok)throw new Error("Could not load questions.json");const data=await response.json();allQuestions=Array.isArray(data)?data:(data.questions||[]);questionsPerGame=Number(data.questionsPerGame)||10;if(!allQuestions.length)throw new Error("No questions found");scoreDisplay.textContent=`Score: 0 / ${questionsPerGame}`}catch(error){question.textContent="ERROR: Could not load questions.json";explanation.textContent="Make sure questions.json is in the same GitHub Pages folder as index.html.";console.error(error)}}
function startGame(){if(!allQuestions.length)return;clearInterval(timerInterval);clearTimeout(revealTimeout);score=0;currentQuestion=0;scoreDisplay.textContent=`Score: 0 / ${questionsPerGame}`;questions=shuffle([...allQuestions]).slice(0,Math.min(questionsPerGame,allQuestions.length)).map(q=>({...q,answers:[...q.answers]}));questions.forEach(q=>{if(Math.random()<.5){[q.answers[0],q.answers[1]]=[q.answers[1],q.answers[0]];q.correct=q.correct===0?1:0}});startButton.style.display="none";restartButton.style.display="none";showQuestion()}
function showQuestion(){clearInterval(timerInterval);clearTimeout(revealTimeout);answered=false;result.textContent="";explanation.textContent="";nextButton.style.display="none";const q=questions[currentQuestion];questionNumber.textContent=`Question ${currentQuestion+1} of ${questions.length}`;question.textContent=q.question;answer0.textContent=q.answers[0];answer1.textContent=q.answers[1];answers.forEach(b=>{b.style.display="none";b.disabled=false;b.classList.remove("correct","wrong")});timer.textContent="Get ready...";revealTimeout=setTimeout(()=>{if(!answered){answers.forEach(b=>b.style.display="block");startTimer(7)}},3000)}
function startTimer(seconds){let timeLeft=seconds;timer.textContent=`Time: ${timeLeft}`;timerInterval=setInterval(()=>{timeLeft--;timer.textContent=`Time: ${timeLeft}`;if(timeLeft<=0){clearInterval(timerInterval);if(!answered)finishQuestion(-1)}},1000)}
function answerQuestion(index){if(!answered)finishQuestion(index)}
function finishQuestion(selectedIndex){clearInterval(timerInterval);clearTimeout(revealTimeout);answered=true;const q=questions[currentQuestion];answers.forEach(b=>b.disabled=true);if(selectedIndex===q.correct){score++;result.textContent="CORRECT!";explanation.textContent=q.correctExplanation;answers[selectedIndex].classList.add("correct")}else{result.textContent="WRONG!";if(selectedIndex>=0)answers[selectedIndex].classList.add("wrong");answers[q.correct].classList.add("correct");explanation.textContent=selectedIndex===-1?"Time ran out. "+q.wrongExplanation:q.wrongExplanation}scoreDisplay.textContent=`Score: ${score} / ${questions.length}`;nextButton.style.display="block"}
function nextQuestion(){currentQuestion++;if(currentQuestion>=questions.length)endGame();else showQuestion()}
function endGame(){clearInterval(timerInterval);questionNumber.textContent="GAME COMPLETE";question.textContent=`Final Score: ${score} / ${questions.length}`;timer.textContent="";answers.forEach(b=>b.style.display="none");result.textContent="";explanation.textContent="";nextButton.style.display="none";restartButton.style.display="block"}
startButton.addEventListener("click",startGame);restartButton.addEventListener("click",startGame);nextButton.addEventListener("click",nextQuestion);answer0.addEventListener("click",()=>answerQuestion(0));answer1.addEventListener("click",()=>answerQuestion(1));
question.textContent="Loading questions...";scoreDisplay.textContent="Score: 0 / 10";loadQuestions();
</script></body></html>
