// --------------------------------------------------
// GAME VARIABLES
// --------------------------------------------------

let questions = [];
let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;
let startTime = 0;
let gameRunning = false;
let timerInterval = null;


// --------------------------------------------------
// PAGE ELEMENTS
// --------------------------------------------------

const questionNumber = document.getElementById("questionNumber");
const question = document.getElementById("question");
const timer = document.getElementById("timer");
const answers = document.getElementById("answers");
const answer0 = document.getElementById("answer0");
const answer1 = document.getElementById("answer1");
const result = document.getElementById("result");
const explanation = document.getElementById("explanation");
const scoreDisplay = document.getElementById("score");
const startButton = document.getElementById("startButton");
const nextButton = document.getElementById("nextButton");
const restartButton = document.getElementById("restartButton");


// --------------------------------------------------
// SHUFFLE
// --------------------------------------------------

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];
    }

    return array;
}


// --------------------------------------------------
// START GAME
// --------------------------------------------------

function startGame() {

    currentQuestion = 0;
    score = 0;

    // Pick 10 random questions from the 50
    questions = shuffle([...allQuestions]).slice(0, 10);

    // Randomize the answer order for each question
    questions.forEach(q => {

        if (Math.random() < 0.5) {

            [q.answers[0], q.answers[1]] =
            [q.answers[1], q.answers[0]];

            q.correct = q.correct === 0 ? 1 : 0;
        }

    });

    scoreDisplay.textContent = "Score: 0 / 10";

    startButton.style.display = "none";
    restartButton.style.display = "none";

    showQuestion();
}


// --------------------------------------------------
// SHOW QUESTION
// --------------------------------------------------

function showQuestion() {

    selectedAnswer = null;

    result.textContent = "";
    explanation.textContent = "";

    const q = questions[currentQuestion];

    questionNumber.textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    question.textContent = q.question;

    answer0.textContent = q.answers[0];
    answer1.textContent = q.answers[1];

    answer0.classList.remove("selected");
    answer1.classList.remove("selected");

    answer0.disabled = false;
    answer1.disabled = false;

    answers.style.display = "none";

    timer.textContent = "3";

    gameRunning = true;

    startTime = performance.now();

    clearInterval(timerInterval);

    timerInterval = setInterval(updateTimer, 50);
}


// --------------------------------------------------
// TIMER
// --------------------------------------------------

function updateTimer() {

    if (!gameRunning) return;

    const elapsed =
        performance.now() - startTime;


    // First 3 seconds:
    // Question is shown but answers are hidden.

    if (elapsed < 3000) {

        const remaining =
            Math.ceil((3000 - elapsed) / 1000);

        timer.textContent = remaining;

        answers.style.display = "none";

        return;
    }


    // Next 7 seconds:
    // Answers are available.

    if (elapsed < 10000) {

        answers.style.display = "flex";

        const remaining =
            Math.ceil((10000 - elapsed) / 1000);

        timer.textContent = remaining;

        return;
    }


    // Time is up.

    finishQuestion();

}


// --------------------------------------------------
// CHOOSE ANSWER
// --------------------------------------------------

function chooseAnswer(index) {

    if (!gameRunning) return;

    const elapsed =
        performance.now() - startTime;


    // Clicking during the 3-second question
    // period counts as wrong.

    if (elapsed < 3000) {

        finishQuestion(true);

        return;
    }


    selectedAnswer = index;

    answer0.classList.remove("selected");
    answer1.classList.remove("selected");

    if (index === 0) {

        answer0.classList.add("selected");

    } else {

        answer1.classList.add("selected");

    }
}


// --------------------------------------------------
// FINISH QUESTION
// --------------------------------------------------

function finishQuestion(earlyWrong = false) {

    if (!gameRunning) return;

    gameRunning = false;

    clearInterval(timerInterval);

    answers.style.display = "flex";

    const q = questions[currentQuestion];

    const correctAnswer = q.correct;


    // CORRECT

    if (
        !earlyWrong &&
        selectedAnswer !== null &&
        selectedAnswer === correctAnswer
    ) {

        score++;

        result.textContent = "CORRECT!";

        explanation.textContent =
            q.correctExplanation;

    }


    // WRONG

    else {

        result.textContent = "WRONG!";

        explanation.textContent =
            q.wrongExplanation;

        answer0.classList.remove("selected");
        answer1.classList.remove("selected");


        // Highlight correct answer

        if (correctAnswer === 0) {

            answer0.classList.add("selected");

        } else {

            answer1.classList.add("selected");

        }

    }


    scoreDisplay.textContent =
        "Score: " + score + " / 10";


    answer0.disabled = true;
    answer1.disabled = true;

    timer.textContent = "0";

    nextButton.style.display = "inline-block";
}


// --------------------------------------------------
// NEXT QUESTION
// --------------------------------------------------

function nextQuestion() {

    nextButton.style.display = "none";

    currentQuestion++;


    if (currentQuestion >= questions.length) {

        endGame();

    } else {

        showQuestion();

    }
}


// --------------------------------------------------
// END GAME
// --------------------------------------------------

function endGame() {

    questionNumber.textContent =
        "Challenge Complete!";

    question.textContent =
        "Final Score: " +
        score +
        " / " +
        questions.length;

    timer.textContent = "";

    answers.style.display = "none";

    result.textContent = "";

    explanation.textContent = "";

    restartButton.style.display = "inline-block";
}


// --------------------------------------------------
// BUTTON EVENTS
// --------------------------------------------------

answer0.addEventListener("click", function() {

    chooseAnswer(0);

});

answer1.addEventListener("click", function() {

    chooseAnswer(1);

});

startButton.addEventListener("click", startGame);

nextButton.addEventListener("click", nextQuestion);

restartButton.addEventListener("click", startGame);

</script>
