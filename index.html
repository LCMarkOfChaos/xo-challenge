<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarkOfChaos X/O Challenge</title>

<style>
    body {
        margin: 0;
        background-image: url("image/XOGame.png");
        background-size: 100% auto;
        background-repeat: no-repeat;
        background-position: center top;
        background-color: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .game {
        max-width: 700px;
        margin: auto;
        padding: 15px 10px;
    }

    h1 {
        font-size: 36px;
        margin-bottom: 10px;
    }

    #questionNumber {
        font-size: 20px;
        margin-bottom: 20px;
    }

    #question {
        font-size: 28px;
        min-height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 25px;
    }

    #timer {
        font-size: 32px;
        font-weight: bold;
        margin: 15px;
    }

    #answers {
        display: none;
        gap: 20px;
        justify-content: center;
        margin-top: 20px;
    }

    button {
        font-size: 24px;
        padding: 20px 35px;
        min-width: 220px;
        cursor: pointer;
        border: 3px solid #555;
        border-radius: 10px;
        background: #222;
        color: white;
    }

    button.selected {
        border-color: white;
        background: #555;
    }

    button:disabled {
        cursor: default;
        opacity: 0.7;
    }

    #result {
        font-size: 30px;
        font-weight: bold;
        margin: 25px;
        min-height: 40px;
    }

    #score {
        font-size: 22px;
        margin-top: 20px;
    }

    #startButton,
    #nextButton,
    #restartButton {
        margin-top: 20px;
        min-width: 180px;
        font-size: 20px;
        padding: 14px 25px;
    }

    #nextButton,
    #restartButton {
        display: none;
    }
</style>
</head>

<body>

<div class="game">

    <h1>MarkOfChaos X/O Challenge</h1>

    <div id="questionNumber">Ready?</div>

    <div id="question">
        Test your Last Chaos knowledge!
    </div>

    <div id="timer">10</div>

    <div id="answers">
        <button id="answer0"></button>
        <button id="answer1"></button>
    </div>

    <div id="result"></div>

    <div id="score">Score: 0 / 10</div>

    <button id="startButton">START</button>
    <button id="nextButton">NEXT</button>
    <button id="restartButton">PLAY AGAIN</button>

</div>

<script>

const questions = [

    {
        question: "Which class is the main healer in the MarkOfChaos party?",
        answers: ["Healer", "Rogue"],
        correct: 0
    },

    {
        question: "How many adventurers can normally be in the MarkOfChaos party?",
        answers: ["6", "10"],
        correct: 0
    },

    {
        question: "Which class protects the party with a shield and sword?",
        answers: ["Knight", "Sorcerer"],
        correct: 0
    },

    {
        question: "Which class is the specialist spell caster?",
        answers: ["Sorcerer", "Titan"],
        correct: 0
    },

    {
        question: "Who determines when the group moves in the Wagon Wheel formation?",
        answers: ["The Centre", "The Rear Guard"],
        correct: 0
    },

    {
        question: "In the Wagon Wheel formation, who watches Player 2?",
        answers: ["Player 1", "Player 4"],
        correct: 0
    },

    {
        question: "What happens to targets attacking the party?",
        answers: ["Concentrated fire", "Everyone runs away"],
        correct: 0
    },

    {
        question: "Which character is the MarkOfChaos mage?",
        answers: ["Markessa", "Farnese"],
        correct: 0
    },

    {
        question: "Which character is the MarkOfChaos healer?",
        answers: ["Farnese", "Markhelm"],
        correct: 0
    },

    {
        question: "Which character is the MarkOfChaos knight?",
        answers: ["Markhelm", "Markion"],
        correct: 0
    }

];

let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;
let startTime = 0;
let gameRunning = false;
let timerInterval = null;

const questionNumber = document.getElementById("questionNumber");
const question = document.getElementById("question");
const timer = document.getElementById("timer");
const answers = document.getElementById("answers");
const answer0 = document.getElementById("answer0");
const answer1 = document.getElementById("answer1");
const result = document.getElementById("result");
const scoreDisplay = document.getElementById("score");
const startButton = document.getElementById("startButton");
const nextButton = document.getElementById("nextButton");
const restartButton = document.getElementById("restartButton");

function startGame() {

    currentQuestion = 0;
    score = 0;

    scoreDisplay.textContent = "Score: 0 / 10";

    startButton.style.display = "none";
    restartButton.style.display = "none";

    showQuestion();
}

function showQuestion() {

    selectedAnswer = null;
    result.textContent = "";

    const q = questions[currentQuestion];

    questionNumber.textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    question.textContent = q.question;

    answer0.textContent = q.answers[0];
    answer1.textContent = q.answers[1];

    answer0.classList.remove("selected");
    answer1.classList.remove("selected");

    answer0.disabled = false;
    answer1.disabled = false;

    // Hide answers for the first 3 seconds.
    answers.style.display = "none";

    timer.textContent = "3";

    gameRunning = true;
    startTime = performance.now();

    clearInterval(timerInterval);

    timerInterval = setInterval(updateTimer, 50);
}

function updateTimer() {

    if (!gameRunning) return;

    const elapsed = performance.now() - startTime;

    // First 3 seconds: answers hidden.
    if (elapsed < 3000) {

        const remaining = Math.ceil((3000 - elapsed) / 1000);
        timer.textContent = remaining;

        answers.style.display = "none";

        return;
    }

    // At exactly 3 seconds answers appear.
    if (elapsed < 10000) {

        answers.style.display = "flex";

        const remaining =
            Math.ceil((10000 - elapsed) / 1000);

        timer.textContent = remaining;

        return;
    }

    // Ten seconds total.
    finishQuestion();
}

function chooseAnswer(index) {

    if (!gameRunning) return;

    const elapsed = performance.now() - startTime;

    // Pressing during the first 3 seconds is wrong.
    if (elapsed < 3000) {
        finishQuestion(true);
        return;
    }

    // Player can change their answer.
    selectedAnswer = index;

    answer0.classList.remove("selected");
    answer1.classList.remove("selected");

    if (index === 0) {
        answer0.classList.add("selected");
    } else {
        answer1.classList.add("selected");
    }
}

function finishQuestion(earlyWrong = false) {

    if (!gameRunning) return;

    gameRunning = false;

    clearInterval(timerInterval);

    answers.style.display = "flex";

    const correctAnswer = questions[currentQuestion].correct;

    if (!earlyWrong &&
        selectedAnswer !== null &&
        selectedAnswer === correctAnswer) {

        score++;
        result.textContent = "CORRECT!";
    } else {

        result.textContent = "WRONG!";

        answer0.classList.remove("selected");
        answer1.classList.remove("selected");

        if (correctAnswer === 0) {
            answer0.classList.add("selected");
        } else {
            answer1.classList.add("selected");
        }
    }

    scoreDisplay.textContent =
        "Score: " + score + " / 10";

    answer0.disabled = true;
    answer1.disabled = true;

    timer.textContent = "0";

    nextButton.style.display = "inline-block";
}

function nextQuestion() {

    nextButton.style.display = "none";

    currentQuestion++;

    if (currentQuestion >= questions.length) {
        endGame();
    } else {
        showQuestion();
    }
}

function endGame() {

    questionNumber.textContent = "Challenge Complete!";
    question.textContent =
        "Final Score: " + score + " / " + questions.length;

    timer.textContent = "";

    answers.style.display = "none";
    result.textContent = "";

    restartButton.style.display = "inline-block";
}

answer0.addEventListener("click", function() {
    chooseAnswer(0);
});

answer1.addEventListener("click", function() {
    chooseAnswer(1);
});

startButton.addEventListener("click", startGame);

nextButton.addEventListener("click", nextQuestion);

restartButton.addEventListener("click", startGame);

</script>

</body>
</html>
