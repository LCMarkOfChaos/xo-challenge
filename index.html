    #startButton,

        left: 0;
        margin: 0;
        font-size: 20px;
        padding: 14px 25px;
        min-width: auto;
        z-index: 1000;
    }

    #nextButton,
    #restartButton {
        display: none;
    }

    #game {
        padding-top: 80px;
    }

    #questionNumber {
        font-size: 22px;
        font-weight: bold;
        margin: 10px;
    }

    #question {
        font-size: 28px;
        font-weight: bold;
        margin: 20px auto;
        max-width: 800px;
    }

    #timer {
        font-size: 26px;
        font-weight: bold;
        margin: 15px;
    }

    #answers {

        margin: 20px auto;
        max-width: 900px;
    }

    .answerButton {
        font-size: 22px;

        border: 2px solid #333;

    }

    .answerButton:hover {

    }

    .answerButton.correct {

    .answerButton.wrong {

</head>

/* =========================================================
   GAME VARIABLES
   ========================================================= */

let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;
let timerInterval = null;


/* =========================================================
   HTML ELEMENTS
   ========================================================= */

const startButton = document.getElementById("startButton");
const nextButton = document.getElementById("nextButton");
const restartButton = document.getElementById("restartButton");

const questionNumber = document.getElementById("questionNumber");
const question = document.getElementById("question");
const timer = document.getElementById("timer");

const answer0 = document.getElementById("answer0");
const answer1 = document.getElementById("answer1");

const answers = [answer0, answer1];

const result = document.getElementById("result");
const explanation = document.getElementById("explanation");
const scoreDisplay = document.getElementById("score");


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
    }

    return array;
}


/* =========================================================
   START GAME
   ========================================================= */

function startGame() {

    score = 0;
    currentQuestion = 0;

    scoreDisplay.textContent = "Score: 0 / 10";

    /*
       Make a new copy of the questions.

       This prevents the original 50-question bank
       from being changed when answer choices are shuffled.
    */

    questions = shuffle([...allQuestions])
        .slice(0, 10)
        .map(q => ({
            ...q,
            answers: [...q.answers]
        }));

    /*
       Randomize the two answer positions.
       If they are swapped, also change the correct answer index.
    */

    questions.forEach(q => {

        if (Math.random() < 0.5) {

            [q.answers[0], q.answers[1]] =
            [q.answers[1], q.answers[0]];

            q.correct = q.correct === 0 ? 1 : 0;
        }

    });

    startButton.style.display = "none";
    restartButton.style.display = "none";

    showQuestion();
}


/* =========================================================
   SHOW QUESTION
   ========================================================= */

function showQuestion() {

    clearInterval(timerInterval);

    answered = false;

    result.textContent = "";
    explanation.textContent = "";

    nextButton.style.display = "none";

    questionNumber.textContent =
        `Question ${currentQuestion + 1} of 10`;

    question.textContent =
        questions[currentQuestion].question;

    answer0.textContent =
        questions[currentQuestion].answers[0];

    answer1.textContent =
        questions[currentQuestion].answers[1];

    answers.forEach(button => {

        button.style.display = "none";

        button.disabled = false;

        button.classList.remove("correct");
        button.classList.remove("wrong");

    });

    timer.textContent = "Get ready...";

    /*
       First 3 seconds:
       Question visible, answers hidden.
    */

    let timeLeft = 10;

    setTimeout(() => {

        if (!answered) {

            answers.forEach(button => {
                button.style.display = "block";
            });

            timer.textContent = "Time: 7";

            startTimer(7);
        }

    }, 3000);
}


/* =========================================================
   TIMER
   ========================================================= */

function startTimer(seconds) {

    let timeLeft = seconds;

    timer.textContent = `Time: ${timeLeft}`;

    timerInterval = setInterval(() => {

        timeLeft--;

        timer.textContent = `Time: ${timeLeft}`;

        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            if (!answered) {
                finishQuestion(-1);
            }

        }

    }, 1000);
}


/* =========================================================
   ANSWER BUTTON
   ========================================================= */

function answerQuestion(index) {

    if (answered) {
        return;
    }

    finishQuestion(index);
}


/* =========================================================
   FINISH QUESTION
   ========================================================= */

function finishQuestion(selectedIndex) {

    clearInterval(timerInterval);

    answered = true;

    const q = questions[currentQuestion];

    /*
       Disable both answers after answering.
    */

    answers.forEach(button => {
        button.disabled = true;
    });


    /* -----------------------------------------
       CORRECT ANSWER
       ----------------------------------------- */

    if (selectedIndex === q.correct) {

        score++;

        result.textContent = "CORRECT!";

        explanation.textContent =
            q.correctExplanation;

        answers[selectedIndex].classList.add("correct");

    }


    /* -----------------------------------------
       WRONG ANSWER
       ----------------------------------------- */

    else {

        result.textContent = "WRONG!";

        /*
           If the player clicked an answer,
           mark it wrong.
        */

        if (selectedIndex >= 0) {

            answers[selectedIndex]
                .classList.add("wrong");

        }

        /*
           Always show the correct answer.
        */

        answers[q.correct]
            .classList.add("correct");


        /*
           If the timer ran out, explain that too.
        */

        if (selectedIndex === -1) {

            explanation.textContent =
                "Time ran out. " + q.wrongExplanation;

        } else {

            explanation.textContent =
                q.wrongExplanation;

        }

    }


    scoreDisplay.textContent =
        `Score: ${score} / 10`;


    /*
       NEXT appears AFTER the explanation.
    */

    nextButton.style.display = "block";
}


/* =========================================================
   NEXT QUESTION
   ========================================================= */

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= 10) {

        endGame();

    } else {

        showQuestion();

    }
}


/* =========================================================
   END GAME
   ========================================================= */

function endGame() {

    clearInterval(timerInterval);

    questionNumber.textContent = "GAME COMPLETE";

    question.textContent =
        `Final Score: ${score} / 10`;

    timer.textContent = "";

    answers.forEach(button => {
        button.style.display = "none";
    });

    result.textContent = "";

    explanation.textContent = "";

    nextButton.style.display = "none";

    restartButton.style.display = "block";
}


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

startButton.addEventListener("click", startGame);

restartButton.addEventListener("click", startGame);

nextButton.addEventListener("click", nextQuestion);

answer0.addEventListener("click", () => {
    answerQuestion(0);
});

answer1.addEventListener("click", () => {
    answerQuestion(1);
});


/* =========================================================
   INITIAL SCREEN
   ========================================================= */

questionNumber.textContent = "";

question.textContent =
    "Press START to begin the X/O Challenge.";

timer.textContent = "";

result.textContent = "";

explanation.textContent = "";

scoreDisplay.textContent = "Score: 0 / 10";

</script>
